services:
  safecore:
    image: safecore:latest
    build:
      context: .
      dockerfile: SafeCore/Dockerfile
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${SAFECORE_CONNECTION_STRING:?Set SAFECORE_CONNECTION_STRING}
      Jwt__SigningKey: ${SAFECORE_JWT_SIGNING_KEY:?Set SAFECORE_JWT_SIGNING_KEY to a random secret of at least 32 bytes}
      BootstrapAdmin__Email: ${SAFECORE_BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${SAFECORE_BOOTSTRAP_ADMIN_PASSWORD:-}
      ForwardedHeaders__KnownProxies__0: ${SAFECORE_TRUSTED_PROXY_IP:-127.0.0.1}
    restart: unless-stopped
  migrate:
    image: safecore:latest
    profiles: ["maintenance"]
    entrypoint: ["dotnet"]
    command: ["SafeCore.dll", "--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: ${SAFECORE_CONNECTION_STRING:?Set SAFECORE_CONNECTION_STRING}
      Jwt__SigningKey: ${SAFECORE_JWT_SIGNING_KEY:?Set SAFECORE_JWT_SIGNING_KEY to a random secret of at least 32 bytes}

